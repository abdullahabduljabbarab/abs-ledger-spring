name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify runs the Testcontainers integration tests; the runner provides the
      # Docker daemon they need to start PostgreSQL.
      - name: Build and test
        run: mvn -B verify
